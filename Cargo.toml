[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lukr54/cram"
# Cram is published to crates.io so `cargo install cram-cli` works, which is how this audience expects
# to install a Rust CLI. The binary is still `cram`; only the crate name carries the suffix, because
# `cram` on crates.io has been held since 2019 by an unrelated abandoned crate.
#
# Publishing the CLI forces publishing its whole dependency graph -- cargo will not accept a crate
# whose dependencies are not on the registry. cram-core, cram-mount, cram-recovery, cram-sign and
# rdm-core therefore go up too. They are implementation details of the CLI rather than libraries
# offered for general use, and each says so in its own description; a breaking change to any of them
# is a major version bump like anything else.
#
# cram-shell opts OUT below: it is a COM cdylib that Explorer loads, useless as a dependency.
publish = true

[profile.release]
opt-level = 3
codegen-units = 1

# EXPERIMENT, NOT SHIPPABLE. sevenz-rust2 compresses a pack straight into the output stream, so packs
# cannot overlap and every thread must come from LZMA2 chunking within a single pack -- capped at
# pack size / dictionary, and costing ratio because a match cannot cross a chunk boundary. A local
# fork adds `prepare_pack` / `push_prepared_pack`, splitting that so a pack can be compressed on a
# worker and appended later, in order.
#
# A published crate cannot depend on a patch, so this has to land upstream (or be published as a fork
# under its own name) before it can ship.
[patch.crates-io]
sevenz-rust2 = { path = "../sevenz-rust2-cram" }
