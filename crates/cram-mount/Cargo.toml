[package]
name = "cram-mount"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Cram archive mount, browse/open a .cram as a virtual folder via Windows ProjFS (no full extract)"
keywords = ["archive", "mount", "projfs", "windows", "filesystem"]
categories = ["filesystem"]
readme = "README.md"

# Lib-only: the CLI (`cli::main`) is driven by the unified `cram` binary (crates/cram-cli) under the
# `mount` verb. The former standalone `cram-mount` bin was folded into it.
[lib]
name = "cram_mount"
path = "src/lib.rs"

[dependencies]
cram-core = { path = "../cram-core", version = "1.2.0" }

getrandom = "0.2" # random GUID for the virtualization-instance id

[target.'cfg(windows)'.dependencies]
# MIT/Apache ProjFS type defs (avoids the GPL `windows-projfs` crate). We take the TYPES from here
# but bind the FUNCTIONS ourselves at run time (see src/projfs_api.rs): ProjectedFSLib.dll ships with
# the optional `Client-ProjFS` feature, which is off by default, and a load-time import of a missing
# DLL stops the whole process from starting, over a feature only `mount` uses.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    # FindFirstFileW, for the reparse tag on a candidate mount root: the tag is the only way to tell
    # a folder a dead mount left behind from a junction that merely happens to be empty.
    "Win32_Storage_FileSystem",
    "Win32_Storage_ProjectedFileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
] }
