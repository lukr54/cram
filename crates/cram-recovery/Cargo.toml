[package]
name = "cram-recovery"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Reed-Solomon recovery sidecar for any file (incl. .cram): create parity, then repair corruption/truncation"
keywords = ["reed-solomon", "recovery", "parity", "repair", "integrity"]
categories = ["filesystem"]
readme = "README.md"

# A recovery sidecar is computed OVER the archive's bytes and stored in a separate `.cramrec` file, so
# it adds no coupling to, and never changes, the frozen `.cram` v1 format (or any other file). Create
# parity up front; if the original later suffers bit-rot or truncation, repair reconstructs it.
#
# Lib-only: the CLI (`cli::main`) is driven by the unified `cram` binary (crates/cram-cli) under the
# `rec` verb. The former standalone `cram-rec` bin was folded into it.
[lib]
name = "cram_recovery"
path = "src/lib.rs"

[dependencies]
# Pure-Rust Reed-Solomon erasure coding (default features only, the `simd-accel` feature needs a C
# toolchain/nightly and is intentionally OFF, keeping the build mingw-clean).
reed-solomon-erasure = "6"
blake3 = "1" # per-shard integrity hashes, so repair knows WHICH shards are corrupt
