# Submits a winget manifest update to microsoft/winget-pkgs for each release, so `winget install
# Nexalit.Cram` tracks the latest version without a hand-authored PR. `release-publish` in ci.yml
# dispatches it right after taking the release out of draft, once all three platform artifacts have
# uploaded, so the versioned Windows zip the manifest points at is already present.
#
# There is no `release: released` trigger. ci.yml un-drafts with GITHUB_TOKEN, and GitHub starts no
# workflow from an event that token caused, so that trigger never fired once; workflow_dispatch is
# the documented exception. Keeping both would also risk two PRs for one release. To submit a
# release by hand: gh workflow run winget.yml -f release-tag=v<ver>
name: Publish to winget

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: "Release tag to submit to winget (e.g. v1.3.1)"
        required: true

jobs:
  winget:
    name: Submit Nexalit.Cram to winget-pkgs
    runs-on: ubuntu-latest
    steps:
      - name: Update the winget manifest
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: Nexalit.Cram
          # The VERSIONED Windows zip, not the cram-latest copy. winget pins an exact versioned URL
          # and SHA per submission; a /releases/latest/ URL would point at whatever ships next and go
          # stale. This regex matches cram-v<ver>-x86_64-pc-windows-gnu.zip and excludes cram-latest-…
          installers-regex: '^cram-v.*-x86_64-pc-windows-gnu\.zip$'
          # The tag ci.yml dispatched with, or the one typed on a manual run.
          release-tag: ${{ inputs.release-tag }}
          # Classic PAT with public_repo scope, stored as a repo secret. The workflow's own
          # GITHUB_TOKEN cannot open a PR against microsoft/winget-pkgs; this one can.
          token: ${{ secrets.WINGET_TOKEN }}
