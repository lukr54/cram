# cargo-about configuration: generates THIRD-PARTY-LICENSES.md, the full-text licence appendix that
# ships beside cram.exe / cram-extract.exe. Every licence the resolved graph uses must appear in
# `accepted`. Regenerate with the command recorded in THIRD-PARTY-NOTICES.md after any dependency change.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "bzip2-1.0.6",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    # webpki-roots, which is Mozilla's CA certificate bundle and therefore data rather than code —
    # which is what CDLA is written for. Permissive, no copyleft, obligation is to keep the
    # disclaimers. Reached the graph when the Linux and macOS targets were added below, because
    # rustls needs a root store and SChannel does not.
    "CDLA-Permissive-2.0",
]
# MPL-2.0 is deliberately absent. THIRD-PARTY-NOTICES.md §5 tells redistributors there is no copyleft
# in the graph; leaving MPL accepted here would let a weak-copyleft crate in and make that claim false
# with no CI signal. Anything not on this list fails generation, which is the point.

# EVERY platform a release archive is published for, not just the one the appendix used to cover.
#
# The graph genuinely differs per platform: on windows-gnu reqwest uses SChannel, so nothing TLS is
# statically linked, while Linux and macOS have no OS stack to borrow and pull in rustls, ring,
# webpki-roots and the rest. Pinning to Windows alone meant `ci.yml` copied a Windows appendix into
# the Linux tarball and the macOS tarball, omitting twelve crates those binaries actually link. That
# is a reproduction-requirement failure, and worse, THIRD-PARTY-NOTICES.md §5 asserts the appendix is
# complete, so the claim was false on two of three platforms.
#
# One union appendix rather than three per-platform files. Over-inclusion is harmless — a Windows
# reader gets notices for crates their binary does not contain — whereas omission is the violation.
# The asymmetry says err inclusive, and it keeps one generated file, one CI check and one command.
#
# These must stay in step with the release jobs in ci.yml. macOS ships aarch64, not x86_64.
targets = [
    "x86_64-pc-windows-gnu",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]

# libmimalloc-sys ships two MIT texts: its own LICENSE.txt (the Rust binding, Octavian Oncescu) and
# the vendored C library's c_src/mimalloc/v{2,3}/LICENSE (Microsoft, Daan Leijen). Left to its file
# scan, cargo-about keeps one file per licence expression, and which one it kept differed between
# Linux and Windows at the same Cargo.lock, so the CI diff failed on whichever side lost. The binary
# links both the binding and the C library, so both texts belong in the appendix. A clarification
# pins the list. The checksums are SHA-256 of each file; when a new libmimalloc-sys version changes
# either file, cargo-about warns that the clarification does not validate and falls back to the scan,
# and these checksums need updating from the new crate's files.
[libmimalloc-sys.clarify]
license = "MIT"

[[libmimalloc-sys.clarify.files]]
path = "LICENSE.txt"
checksum = "a08554fab028af3af047e8588d32d019662c1b1bf07959a195a2f75fe340726b"

[[libmimalloc-sys.clarify.files]]
path = "c_src/mimalloc/v2/LICENSE"
checksum = "82ade5d7d9b029044b5fbbc326207fc47c2d44ee4dd71e8a559c36d728217de9"
# c_src/mimalloc/v3/LICENSE is byte-identical to v2's (same checksum) and is left out: listing it
# makes cargo-about print the crate twice under the same text.
