[package]
name = "cram-cli"
# Deliberately not `version.workspace = true`. 1.0.0 went to crates.io without the windows-gnu link
# flags (they were only in .cargo/config.toml, which is not published) and could not link there. A
# published version is immutable, so the fix in build.rs only reached anyone as a new number: 1.0.1,
# which the rest of the workspace skipped. They have moved together since 1.0.2, so this is the same
# number as the workspace today and the override is kept only so the two can diverge again if
# another crates.io-only fix is ever needed.
version = "1.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Cram, the single `cram` command line: list/extract/create/test/convert/download/mount/rec/sign/verify/keygen/make-sfx"
# `cram` itself has been taken on crates.io since 2019 by an unrelated crate, so the install name
# carries the suffix while the binary stays `cram`: `cargo install cram-cli`, then run `cram`.
keywords = ["archive", "compression", "zip", "7z", "cli"]
categories = ["command-line-utilities", "compression", "filesystem"]
readme = "README.md"

# The one unified operator binary. It owns argument parsing for the archive verbs (calling cram-core's
# engine) and delegates the sidecar/mount tools to their crates' `cli::main`. The self-extractor stub
# (`cram-extract`) stays a separate tiny binary on purpose, `make-sfx` shells out to it.
[[bin]]
name = "cram"
path = "src/main.rs"

# The internal crates carry BOTH a path and a version: cargo builds against the path in this
# workspace and rewrites the dependency to the version when packaging for crates.io. Without the
# version, `cargo publish` refuses the crate outright.
[dependencies]
cram-core = { path = "../cram-core", version = "1.1.0" }
# Reading the release JSON for `cram update`. Optional, so a default build (no `download`) does not
# compile it; already in the graph via rdm-core, so it costs nothing extra in a shipped build.
serde_json = { version = "1", optional = true }
# See the `mimalloc` feature. Optional, so a default build never compiles it.
mimalloc = { version = "0.1", optional = true }
cram-mount = { path = "../cram-mount", version = "1.1.0" }
cram-recovery = { path = "../cram-recovery", version = "1.1.0" }
cram-sign = { path = "../cram-sign", version = "1.1.0" }

[features]
default = []
# Forward the opt-in cram-core features so `cram` can be built with them.
download = ["cram-core/download", "dep:serde_json"]
zstd-c = ["cram-core/zstd-c"]
# Perceptual image hashing, so `cram dedup --similar` can flag visually-alike photos.
phash = ["cram-core/phash"]
# Replace the system allocator with mimalloc. Create is allocation-heavy -- a pack buffer per lane,
# a chunk buffer per file, and one small Vec per chunk of every file -- and the system allocator is
# where that lands. Opt-in because it is a C dependency and the default build must stay compilable
# on a bare mingw toolchain; on in the shipped binary, which already carries C for UnRAR and zstd.
mimalloc = ["dep:mimalloc"]
