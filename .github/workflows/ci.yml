name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  # A push only starts a run if GitHub delivers the webhook. During the Actions incident of
  # 2026-08-06 delivery was throttled to ~15%, so a push could land and produce no run at all --
  # not a red run, silence. `gh run rerun` cannot help there, because there is no run to re-run.
  # This is the manual way in. Dispatching on a `v*` tag will also run the release jobs, since
  # those are gated on the ref rather than the event.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Cram targets the GNU (mingw) toolchain: the UnRAR C++ dependency is built with g++, and
  # .cargo/config.toml carries link flags that only apply to x86_64-pc-windows-gnu.
  CARGO_BUILD_TARGET: x86_64-pc-windows-gnu

jobs:
  test:
    name: build + test (windows-gnu)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add the bundled MinGW toolchain to PATH
        shell: pwsh
        run: |
          # The windows runner images ship mingw-w64; the linker must be reachable as x86_64-w64-mingw32-gcc.
          $mingw = @('C:\mingw64\bin', 'C:\ProgramData\mingw64\mingw64\bin', 'C:\msys64\mingw64\bin') |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $mingw) { throw 'No MinGW toolchain found on this runner image' }
          Add-Content -Path $env:GITHUB_PATH -Value $mingw -Encoding utf8
          & "$mingw\gcc.exe" --version

      - name: Install the Rust GNU target
        run: rustup target add x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # The shipped configuration, which is not the default one: the CLI is released with the C zstd
      # backend and the download feature on, and those code paths are otherwise never compiled here.
      - name: Build the release configuration
        run: |
          cargo build --release -p cram-cli --features download,zstd-c,phash
          cargo build --release -p cram-extract
          cargo build --release -p cram-shell

      # The parsers eat untrusted input, so the fuzz smoke tests are part of the gate rather than
      # something run by hand. They are bounded and fast; they are NOT a substitute for a real
      # coverage-guided fuzzing campaign.
      - name: Fuzz smoke tests
        run: cargo test --workspace fuzz

  test-linux:
    name: build + test (linux-gnu)
    runs-on: ubuntu-latest
    # Override the workflow-level Windows target: this job builds for the Linux host. The `.cargo`
    # link flags are scoped to x86_64-pc-windows-gnu, so they don't apply here.
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      # g++ builds the UnRAR C++ dependency; build-essential is preinstalled on the runner image but
      # pinned here so the job is self-describing and survives an image change.
      - name: Install the C/C++ toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Install the Rust GNU target
        run: rustup target add x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # Same shipped configuration as Windows: download + C zstd on. On Linux the download stack
      # resolves reqwest to rustls (no system OpenSSL), per the per-OS split in the crate manifests.
      - name: Build the release configuration
        run: |
          cargo build --release -p cram-cli --features download,zstd-c,phash
          cargo build --release -p cram-extract

      - name: Fuzz smoke tests
        run: cargo test --workspace fuzz

  test-macos:
    name: build + test (macos, apple silicon)
    runs-on: macos-latest
    # macOS binaries can only be produced on Apple hardware, so this job is the *only* place the
    # macOS code paths are compiled and run at all. Treat a failure here as the first real signal,
    # not a flake.
    env:
      CARGO_BUILD_TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust target
        run: rustup target add aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # The shipped configuration. `download` resolves to rustls here (the per-OS split in the crate
      # manifests treats macOS as non-Windows), so no system OpenSSL is needed.
      - name: Build the release configuration
        run: |
          cargo build --release -p cram-cli --features download,zstd-c,phash
          cargo build --release -p cram-extract

      - name: Fuzz smoke tests
        run: cargo test --workspace fuzz

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the tree for credential-shaped strings
        shell: bash
        run: |
          set -uo pipefail
          # Deliberately pattern-based and small: this catches the specific things that would be
          # catastrophic to commit here (a private signing seed, plus payment- and email-provider API
          # keys) rather than pretending to be a general-purpose scanner. `.gitignore` is a backstop,
          # not the control: a pasted secret has no telltale file extension.
          patterns=(
            'BEGIN [A-Z ]*PRIVATE KEY'
            'whsec_[A-Za-z0-9]{16,}'
            'sk_(live|test)_[A-Za-z0-9]{16,}'
            're_[A-Za-z0-9]{16,}'
            'ghp_[A-Za-z0-9]{20,}'
            'AKIA[0-9A-Z]{16}'
          )
          fail=0
          for p in "${patterns[@]}"; do
            if git grep -nIE "$p" -- . ':(exclude).github/workflows/ci.yml'; then
              echo "::error::secret-shaped string matching /$p/ is committed"
              fail=1
            fi
          done
          # A bare 64-hex-char string is what a private signing seed looks like, and such a seed is the
          # one secret whose leak cannot be undone. Matching on a nearby keyword was tried and is
          # weak in both directions -- it misses a constant whose name rustfmt wrapped onto the line
          # above, and it would wave through a real seed labelled `PUBKEY`. So known-safe values are
          # allowlisted BY VALUE, reviewably, in .github/secret-scan-allowlist.txt.
          grep -oE '^[0-9a-fA-F]{64}$' .github/secret-scan-allowlist.txt > /tmp/approved-hex.txt || true
          if git grep -nIE '\b[0-9a-fA-F]{64}\b' -- . \
              ':(exclude)Cargo.lock' ':(exclude).github/secret-scan-allowlist.txt' \
              ':(exclude).github/workflows/ci.yml' \
            | { grep -viFf /tmp/approved-hex.txt || true; } | grep . ; then
            echo "::error::unexplained 64-hex-character string committed. If it is safe to publish, add it to .github/secret-scan-allowlist.txt with a justification."
            fail=1
          fi
          exit $fail

  licences:
    name: licence appendix is current
    runs-on: ubuntu-latest
    # cargo-about resolves the dependency graph and never compiles it, and about.toml pins the triples
    # on its own -- all three shipped platforms since 2026-08-02, not just Windows -- so this can run
    # anywhere and needs no `--target`. Override the workflow-level target so `cargo install` builds
    # cargo-about for this host.
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      # `--features cli` is not optional: cargo-about's binary carries `required-features = ["cli"]`
      # and the feature is not on by default, so without it `cargo install` warns and installs
      # nothing, exits 0, and the failure only surfaces one step later as "no such subcommand".
      - name: Install cargo-about
        run: cargo install cargo-about --locked --version 0.9.1 --features cli

      # THIRD-PARTY-NOTICES.md §5 tells redistributors that the appendix carries the full licence text
      # for every crate linked in, and that this is what discharges the MIT/BSD reproduction
      # requirement. An appendix that has drifted from Cargo.lock is therefore a compliance failure,
      # not a documentation nit -- it shipped once already, missing eleven crates. `--workspace` is
      # what makes one run cover all three artifacts in the zip: cram.exe, cram-extract.exe and
      # cram_shell.dll. The `tr -d '\r'` is not cosmetic: a few crates' own LICENSE files carry CRLF,
      # which .gitattributes normalises to LF on the way into the repo but cargo-about reproduces
      # verbatim, so an unnormalised comparison fails on every run.
      - name: Regenerate the licence appendix and check the committed copy against it
        run: |
          cargo about generate -c about.toml about.hbs -o /tmp/regenerated.md \
            --workspace --features "download zstd-c phash"
          tr -d '\r' < /tmp/regenerated.md > /tmp/regenerated.lf.md
          if ! diff -u THIRD-PARTY-LICENSES.md /tmp/regenerated.lf.md; then
            echo "::error::THIRD-PARTY-LICENSES.md no longer matches the dependency graph. Regenerate it with the command in THIRD-PARTY-NOTICES.md and commit the result."
            exit 1
          fi

  # Runs only on a pushed `v*` tag, after test + secret-scan pass. Packages the shipped binaries with
  # the licence files and BOTH notice documents, so THIRD-PARTY-NOTICES.md's "installed alongside the
  # binaries" claim is actually true for a release download.
  release:
    name: package + publish release (windows)
    # `licences` is in here for the same reason the tests are: without it the drift gate fails the
    # push and the tag still publishes the stale appendix, which is the case it exists to stop.
    needs: [test, test-linux, test-macos, secrets, licences]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Add the bundled MinGW toolchain to PATH
        shell: pwsh
        run: |
          $mingw = @('C:\mingw64\bin', 'C:\ProgramData\mingw64\mingw64\bin', 'C:\msys64\mingw64\bin') |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $mingw) { throw 'No MinGW toolchain found on this runner image' }
          Add-Content -Path $env:GITHUB_PATH -Value $mingw -Encoding utf8

      - name: Install the Rust GNU target
        run: rustup target add x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Build the shipped binaries
        run: |
          cargo build --release -p cram-cli --features download,zstd-c,phash
          cargo build --release -p cram-extract
          cargo build --release -p cram-shell

      - name: Stage the distributable
        shell: bash
        run: |
          set -euo pipefail
          rel=target/x86_64-pc-windows-gnu/release
          dist="cram-${GITHUB_REF_NAME}-x86_64-pc-windows-gnu"
          mkdir "$dist"
          # cram_shell.dll is the Explorer context menu, and `cram shell install` registers it from
          # wherever it sits next to cram.exe — so it has to travel with it.
          cp "$rel/cram.exe" "$rel/cram-extract.exe" "$rel/cram_shell.dll" "$dist"/
          cp LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.md THIRD-PARTY-LICENSES.md README.md "$dist"/
          # libwinpthread-1.dll must ship next to the exe (see THIRD-PARTY-NOTICES.md section 3).
          cp "$(dirname "$(command -v gcc)")/libwinpthread-1.dll" "$dist"/
          7z a "$dist.zip" "$dist" >/dev/null
          # `cram update` refuses to install an archive it cannot verify, so the Windows artifact
          # needs its checksum published the same way the Linux and macOS ones do.
          sha256sum "$dist.zip" > SHA256SUMS.windows
          # A second copy under a version-free name. GitHub serves
          # /releases/latest/download/<asset> as a permanent redirect to the newest release's asset
          # of that exact name, so a download button on nexalit.fr can be a plain <a href> that never
          # needs editing again — but only if the filename does not move with the tag.
          #
          # `cram update` is unaffected: it builds the URL from a character-checked tag and asks for
          # the VERSIONED artifact, which is the one SHA256SUMS.windows covers. This copy is for
          # humans clicking a link, and is deliberately not checksummed as a second entry, so there
          # is exactly one authoritative hash per release.
          #
          # No change needed below: the `gh release create` file list already globs
          # cram-*-x86_64-pc-windows-gnu.zip, which matches both.
          cp "$dist.zip" cram-latest-x86_64-pc-windows-gnu.zip

      # Created as a DRAFT. `/releases/latest` — what `cram update` asks for and what the Releases
      # page shows — skips drafts, so nobody is offered a release whose Linux and macOS artifacts are
      # still being built. `release-publish` flips it once all three have uploaded.
      - name: Create the GitHub release as a draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release body is what Cram Studio's updater renders verbatim, and the first thing
          # anyone sees on the Releases page. `--generate-notes` emits a raw commit list, which
          # would mean CHANGELOG.md appears nowhere at all. Extract this version's section from it
          # instead, and fall back to generated notes only if that section cannot be found.
          # index() rather than a regex, so the brackets in "## [1.0.0]" need no escaping through
          # YAML, bash and awk in turn.
          ver="${GITHUB_REF_NAME#v}"
          awk -v hdr="## [$ver]" '
            index($0, hdr) == 1 { inside = 1; next }
            inside && index($0, "## [") == 1 { exit }
            inside { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ -s RELEASE_NOTES.md ]; then
            notes=(--notes-file RELEASE_NOTES.md)
          else
            echo "::warning::no CHANGELOG.md section for $ver; falling back to generated notes"
            notes=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "Cram $GITHUB_REF_NAME" \
            --draft \
            "${notes[@]}" \
            cram-*-x86_64-pc-windows-gnu.zip SHA256SUMS.windows

  # The Linux artifact for the same release. Built on the OLDEST supported runner (Ubuntu 22.04,
  # glibc 2.35) so the binary also runs on newer distros; a binary built against a newer glibc would
  # refuse to start on an older one. Runs after `release` so the GitHub release already exists to
  # upload into, and writes the SHA256SUMS that install.sh verifies against.
  release-linux:
    name: package + publish release (linux)
    needs: [release, licences]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install the C/C++ toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Install the Rust GNU target
        run: rustup target add x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Build the shipped binaries
        run: |
          cargo build --release -p cram-cli --features download,zstd-c,phash
          cargo build --release -p cram-extract

      - name: Stage the distributable
        run: |
          set -euo pipefail
          rel=target/x86_64-unknown-linux-gnu/release
          dist="cram-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu"
          mkdir "$dist"
          cp "$rel/cram" "$rel/cram-extract" "$dist"/
          cp LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.md THIRD-PARTY-LICENSES.md README.md "$dist"/
          tar -czf "$dist.tar.gz" "$dist"
          sha256sum "$dist.tar.gz" > SHA256SUMS

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" cram-*-x86_64-unknown-linux-gnu.tar.gz SHA256SUMS --clobber

  # The Apple Silicon artifact. Not signed or notarised: the CLI is meant to be run from a terminal,
  # where clearing the download quarantine flag (which install.sh does) is enough. Notarisation would
  # mean a paid Apple Developer account and only matters for a distributed .app bundle.
  release-macos:
    name: package + publish release (macos)
    needs: [release, licences]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      CARGO_BUILD_TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust target
        run: rustup target add aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build the shipped binaries
        run: |
          cargo build --release -p cram-cli --features download,zstd-c,phash
          cargo build --release -p cram-extract

      - name: Stage the distributable
        run: |
          set -euo pipefail
          rel=target/aarch64-apple-darwin/release
          dist="cram-${GITHUB_REF_NAME}-aarch64-apple-darwin"
          mkdir "$dist"
          cp "$rel/cram" "$rel/cram-extract" "$dist"/
          cp LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.md THIRD-PARTY-LICENSES.md README.md "$dist"/
          tar -czf "$dist.tar.gz" "$dist"
          shasum -a 256 "$dist.tar.gz" > SHA256SUMS.macos

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" cram-*-aarch64-apple-darwin.tar.gz SHA256SUMS.macos --clobber

  # The last step, and the only one that makes the release visible. A failure in either platform job
  # leaves the release a draft with whatever did upload attached: nothing is offered to anyone, and
  # re-running the tag's workflow replaces the assets rather than racing a published download.
  release-publish:
    name: publish the release (all platforms uploaded)
    needs: [release, release-linux, release-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Take the release out of draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
