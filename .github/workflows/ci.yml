name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Cram targets the GNU (mingw) toolchain: the UnRAR C++ dependency is built with g++, and
  # .cargo/config.toml carries link flags that only apply to x86_64-pc-windows-gnu.
  CARGO_BUILD_TARGET: x86_64-pc-windows-gnu

jobs:
  test:
    name: build + test (windows-gnu)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add the bundled MinGW toolchain to PATH
        shell: pwsh
        run: |
          # The windows runner images ship mingw-w64; the linker must be reachable as x86_64-w64-mingw32-gcc.
          $mingw = @('C:\mingw64\bin', 'C:\ProgramData\mingw64\mingw64\bin', 'C:\msys64\mingw64\bin') |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $mingw) { throw 'No MinGW toolchain found on this runner image' }
          Add-Content -Path $env:GITHUB_PATH -Value $mingw -Encoding utf8
          & "$mingw\gcc.exe" --version

      - name: Install the Rust GNU target
        run: rustup target add x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # The shipped configuration, which is not the default one: the CLI is released with the C zstd
      # backend and the download feature on, and those code paths are otherwise never compiled here.
      - name: Build the release configuration
        run: |
          cargo build --release -p cram-cli --features download,zstd-c,phash
          cargo build --release -p cram-extract

      # The parsers eat untrusted input, so the fuzz smoke tests are part of the gate rather than
      # something run by hand. They are bounded and fast; they are NOT a substitute for a real
      # coverage-guided fuzzing campaign.
      - name: Fuzz smoke tests
        run: cargo test --workspace fuzz

  test-linux:
    name: build + test (linux-gnu)
    runs-on: ubuntu-latest
    # Override the workflow-level Windows target: this job builds for the Linux host. The `.cargo`
    # link flags are scoped to x86_64-pc-windows-gnu, so they don't apply here.
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      # g++ builds the UnRAR C++ dependency; build-essential is preinstalled on the runner image but
      # pinned here so the job is self-describing and survives an image change.
      - name: Install the C/C++ toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Install the Rust GNU target
        run: rustup target add x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # Same shipped configuration as Windows: download + C zstd on. On Linux the download stack
      # resolves reqwest to rustls (no system OpenSSL), per the per-OS split in the crate manifests.
      - name: Build the release configuration
        run: |
          cargo build --release -p cram-cli --features download,zstd-c,phash
          cargo build --release -p cram-extract

      - name: Fuzz smoke tests
        run: cargo test --workspace fuzz

  test-macos:
    name: build + test (macos, apple silicon)
    runs-on: macos-latest
    # macOS binaries can only be produced on Apple hardware, so this job is the *only* place the
    # macOS code paths are compiled and run at all. Treat a failure here as the first real signal,
    # not a flake.
    env:
      CARGO_BUILD_TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust target
        run: rustup target add aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # The shipped configuration. `download` resolves to rustls here (the per-OS split in the crate
      # manifests treats macOS as non-Windows), so no system OpenSSL is needed.
      - name: Build the release configuration
        run: |
          cargo build --release -p cram-cli --features download,zstd-c,phash
          cargo build --release -p cram-extract

      - name: Fuzz smoke tests
        run: cargo test --workspace fuzz

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the tree for credential-shaped strings
        shell: bash
        run: |
          set -uo pipefail
          # Deliberately pattern-based and small: this catches the specific things that would be
          # catastrophic to commit here (a private signing seed, plus payment- and email-provider API
          # keys) rather than pretending to be a general-purpose scanner. `.gitignore` is a backstop,
          # not the control: a pasted secret has no telltale file extension.
          patterns=(
            'BEGIN [A-Z ]*PRIVATE KEY'
            'whsec_[A-Za-z0-9]{16,}'
            'sk_(live|test)_[A-Za-z0-9]{16,}'
            're_[A-Za-z0-9]{16,}'
            'ghp_[A-Za-z0-9]{20,}'
            'AKIA[0-9A-Z]{16}'
          )
          fail=0
          for p in "${patterns[@]}"; do
            if git grep -nIE "$p" -- . ':(exclude).github/workflows/ci.yml'; then
              echo "::error::secret-shaped string matching /$p/ is committed"
              fail=1
            fi
          done
          # A bare 64-hex-char string is what a private signing seed looks like, and such a seed is the
          # one secret whose leak cannot be undone. Matching on a nearby keyword was tried and is
          # weak in both directions -- it misses a constant whose name rustfmt wrapped onto the line
          # above, and it would wave through a real seed labelled `PUBKEY`. So known-safe values are
          # allowlisted BY VALUE, reviewably, in .github/secret-scan-allowlist.txt.
          grep -oE '^[0-9a-fA-F]{64}$' .github/secret-scan-allowlist.txt > /tmp/approved-hex.txt || true
          if git grep -nIE '\b[0-9a-fA-F]{64}\b' -- . \
              ':(exclude)Cargo.lock' ':(exclude).github/secret-scan-allowlist.txt' \
              ':(exclude).github/workflows/ci.yml' \
            | { grep -viFf /tmp/approved-hex.txt || true; } | grep . ; then
            echo "::error::unexplained 64-hex-character string committed. If it is safe to publish, add it to .github/secret-scan-allowlist.txt with a justification."
            fail=1
          fi
          exit $fail

  # Runs only on a pushed `v*` tag, after test + secret-scan pass. Packages the shipped binaries with
  # the licence files and BOTH notice documents, so THIRD-PARTY-NOTICES.md's "installed alongside the
  # binaries" claim is actually true for a release download.
  release:
    name: package + publish release (windows)
    needs: [test, test-linux, test-macos, secrets]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Add the bundled MinGW toolchain to PATH
        shell: pwsh
        run: |
          $mingw = @('C:\mingw64\bin', 'C:\ProgramData\mingw64\mingw64\bin', 'C:\msys64\mingw64\bin') |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $mingw) { throw 'No MinGW toolchain found on this runner image' }
          Add-Content -Path $env:GITHUB_PATH -Value $mingw -Encoding utf8

      - name: Install the Rust GNU target
        run: rustup target add x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Build the shipped binaries
        run: |
          cargo build --release -p cram-cli --features download,zstd-c,phash
          cargo build --release -p cram-extract

      - name: Stage the distributable
        shell: bash
        run: |
          set -euo pipefail
          rel=target/x86_64-pc-windows-gnu/release
          dist="cram-${GITHUB_REF_NAME}-x86_64-pc-windows-gnu"
          mkdir "$dist"
          cp "$rel/cram.exe" "$rel/cram-extract.exe" "$dist"/
          cp LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.md THIRD-PARTY-LICENSES.md README.md "$dist"/
          # libwinpthread-1.dll must ship next to the exe (see THIRD-PARTY-NOTICES.md section 3).
          cp "$(dirname "$(command -v gcc)")/libwinpthread-1.dll" "$dist"/
          7z a "$dist.zip" "$dist" >/dev/null
          # `cram update` refuses to install an archive it cannot verify, so the Windows artifact
          # needs its checksum published the same way the Linux and macOS ones do.
          sha256sum "$dist.zip" > SHA256SUMS.windows

      - name: Publish the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Cram $GITHUB_REF_NAME" \
            --generate-notes \
            cram-*-x86_64-pc-windows-gnu.zip SHA256SUMS.windows

  # The Linux artifact for the same release. Built on the OLDEST supported runner (Ubuntu 22.04,
  # glibc 2.35) so the binary also runs on newer distros; a binary built against a newer glibc would
  # refuse to start on an older one. Runs after `release` so the GitHub release already exists to
  # upload into, and writes the SHA256SUMS that install.sh verifies against.
  release-linux:
    name: package + publish release (linux)
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install the C/C++ toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Install the Rust GNU target
        run: rustup target add x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Build the shipped binaries
        run: |
          cargo build --release -p cram-cli --features download,zstd-c,phash
          cargo build --release -p cram-extract

      - name: Stage the distributable
        run: |
          set -euo pipefail
          rel=target/x86_64-unknown-linux-gnu/release
          dist="cram-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu"
          mkdir "$dist"
          cp "$rel/cram" "$rel/cram-extract" "$dist"/
          cp LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.md THIRD-PARTY-LICENSES.md README.md "$dist"/
          tar -czf "$dist.tar.gz" "$dist"
          sha256sum "$dist.tar.gz" > SHA256SUMS

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" cram-*-x86_64-unknown-linux-gnu.tar.gz SHA256SUMS --clobber

  # The Apple Silicon artifact. Not signed or notarised: the CLI is meant to be run from a terminal,
  # where clearing the download quarantine flag (which install.sh does) is enough. Notarisation would
  # mean a paid Apple Developer account and only matters for a distributed .app bundle.
  release-macos:
    name: package + publish release (macos)
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      CARGO_BUILD_TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust target
        run: rustup target add aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build the shipped binaries
        run: |
          cargo build --release -p cram-cli --features download,zstd-c,phash
          cargo build --release -p cram-extract

      - name: Stage the distributable
        run: |
          set -euo pipefail
          rel=target/aarch64-apple-darwin/release
          dist="cram-${GITHUB_REF_NAME}-aarch64-apple-darwin"
          mkdir "$dist"
          cp "$rel/cram" "$rel/cram-extract" "$dist"/
          cp LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.md THIRD-PARTY-LICENSES.md README.md "$dist"/
          tar -czf "$dist.tar.gz" "$dist"
          shasum -a 256 "$dist.tar.gz" > SHA256SUMS.macos

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" cram-*-aarch64-apple-darwin.tar.gz SHA256SUMS.macos --clobber
